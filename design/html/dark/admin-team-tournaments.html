<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team editor, Tournaments tab (dark) — design reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}


body{margin:0}
.il-root{--ground:#F3F5F7;--surface:#FFFFFF;--ink:#0D1117;--muted:#56606E;--body:#3A4350;--line:#DDE2E8;--line2:#B6BEC9;--chip:#E9ECF0;--inv-bg:#0D1117;--inv-fg:#FFFFFF;--blue-ink:#1A73C8;--blue-tint:#DCEEFB;--blue-tint-ink:#0F4F8A;--pink-tint:#FCE7F0;--pink-tint-ink:#A80F4B;--band-bg:#0D1117;--band-fg:#FFFFFF;--dot1:#E84388;--dot2:#55AEEB;--panel:#0D1117;--logo-bg:transparent;--danger-ink:#8A1222;--danger-line:#F3B6BD;--warn-bg:#FFF6DF;--warn-line:#F0C36D;color-scheme:light}
.il-root[data-theme="dark"]{--ground:#0B0F15;--surface:#151B24;--ink:#F2F5F8;--muted:#9AA6B5;--body:#C3CBD6;--line:#283140;--line2:#3B4657;--chip:#232C39;--inv-bg:#F2F5F8;--inv-fg:#0D1117;--blue-ink:#6DBBF0;--blue-tint:#15324B;--blue-tint-ink:#9BD2F8;--pink-tint:#47162C;--pink-tint-ink:#F9A8CB;--band-bg:#E84388;--band-fg:#0D1117;--dot1:#0D1117;--dot2:#FFFFFF;--panel:#151B24;--logo-bg:#FFFFFF;--danger-ink:#FF9AA5;--danger-line:#5A1F27;--warn-bg:#33290F;--warn-line:#7A5E16;color-scheme:dark}
.il-root,.il-root *{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
.il-root input,.il-root textarea,.il-root select{background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<!-- Static design reference exported from the design canvas. Styling is inline on purpose: read it as a spec, do not paste it into the app. Not interactive. -->
<div style="display: contents;">

<div style="min-height: 900px; background: #151B24">
<div style="display: contents;"><div style="display: contents;">

<div class="il-root" data-theme="dark" style="font-family: Archivo, system-ui, sans-serif; color: var(--ink); background: var(--surface); font-size: 15px; line-height: 1.45">






<div style="display: flex; flex-wrap: wrap; min-height: 900px">

<aside style="flex: 1 0 232px; max-width: 100%; box-sizing: border-box; background: var(--ground); border-right: 1px solid var(--line); padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<img src="../../../assets/logo.png" alt="Impact Legends Volleyball" style="height: 60px; width: auto; display: block; background: var(--logo-bg); border-radius: 14px; padding: 2px 8px; box-sizing: border-box; margin-left: -6px">
<div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">Admin</div>
</div>
<nav aria-label="Admin" style="display: flex; flex-wrap: wrap; gap: 4px">

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"></path></svg>
<span style="flex: 1">Dashboard</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75"></span>
</button>

<button type="button" aria-current="page" style="flex: 1 1 150px; font: inherit; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: var(--inv-bg); color: var(--inv-fg); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.9M15.5 3.2a3.5 3.5 0 0 1 0 6.6"></path></svg>
<span style="flex: 1">Teams</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">6</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
<span style="flex: 1">Sponsors</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">8</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l6 4V6L6 10H3zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
<span style="flex: 1">Announcements</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">3</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
<span style="flex: 1">Community</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">1</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
<span style="flex: 1">Settings</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75"></span>
</button>

</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" role="switch" aria-checked="" style="font: inherit; font-weight: 600; height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px">Dark mode<span style="position: relative; flex: none; width: 44px; height: 26px; border-radius: 999px; background: #E84388; transition: background-color .3s"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transform: translateX(18px); transition: transform .3s cubic-bezier(.2,.8,.2,1)"></span></span></button>
<a href="#" style="text-decoration: none; color: var(--ink); text-align: center; padding: 11px 10px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 600">View site ↗</a>
<button type="button" style="font: inherit; font-weight: 600; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer">Sign out</button>
</div>
</aside>

<main id="il-admin-main" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">









<div style="display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; align-items: flex-end">
<div>
<button type="button" style="font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 0; padding: 6px 0; cursor: pointer">← All teams</button>
<h1 style="margin: 2px 0 0; font-stretch: 125%; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">14 Blue<span style="font-family: 'Geist Mono', monospace; font-stretch: 100%; font-weight: 500; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--blue-tint); color: var(--blue-tint-ink); padding: 4px 10px; border-radius: 999px">Blue</span><span style="font-stretch: 100%; font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--muted)">Ages 14 &amp; Under</span></h1>
</div>
<a href="#" style="text-decoration: none; color: var(--ink); font-weight: 600; padding: 11px 18px; border-radius: 999px; border: 1.5px solid var(--ink)">View team page ↗</a>
</div>
<div role="tablist" aria-label="Team editor" style="position: relative; display: flex; overflow-x: auto; border-bottom: 1px solid var(--line)">

<button type="button" role="tab" style="flex: 0 0 140px; font: inherit; font-weight: 600; height: 46px; background: transparent; border: 0; cursor: pointer; color: var(--muted); transition: color .2s">Details<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; margin-left: 6px; color: var(--muted)"></span></button>

<button type="button" role="tab" style="flex: 0 0 140px; font: inherit; font-weight: 600; height: 46px; background: transparent; border: 0; cursor: pointer; color: var(--muted); transition: color .2s">Roster<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; margin-left: 6px; color: var(--muted)">0</span></button>

<button type="button" role="tab" aria-selected="" style="flex: 0 0 140px; font: inherit; font-weight: 600; height: 46px; background: transparent; border: 0; cursor: pointer; color: var(--ink); transition: color .2s">Tournaments<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; margin-left: 6px; color: var(--muted)">1</span></button>

<button type="button" role="tab" style="flex: 0 0 140px; font: inherit; font-weight: 600; height: 46px; background: transparent; border: 0; cursor: pointer; color: var(--muted); transition: color .2s">Practices<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; margin-left: 6px; color: var(--muted)">0</span></button>

<button type="button" role="tab" style="flex: 0 0 140px; font: inherit; font-weight: 600; height: 46px; background: transparent; border: 0; cursor: pointer; color: var(--muted); transition: color .2s">Coaches<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; margin-left: 6px; color: var(--muted)">0</span></button>

<span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 140px; height: 3px; border-radius: 3px 3px 0 0; background: #E84388; transform: translateX(280px); transition: transform .35s cubic-bezier(.2,.8,.2,1)"></span>
</div>








<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 3 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center">
<span style="color: var(--muted)">1 tournament · sorted by start date automatically</span>
<button type="button" style="font: inherit; font-weight: 600; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); border: 0; cursor: pointer">+ Add tournament</button>
</div>
<div style="overflow: hidden; max-height: 0px; opacity: 0; transition: max-height .35s ease, opacity .25s ease">
<div style="background: var(--inv-bg); color: var(--inv-fg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E84388"></span>Order changed. Not saved yet.</span>
<span style="display: flex; gap: 8px"><button type="button" style="font: inherit; font-weight: 600; height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--inv-fg); background: transparent; color: var(--inv-fg); cursor: pointer">Reset</button><button type="button" style="font: inherit; font-weight: 600; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--inv-fg); color: var(--inv-bg); cursor: pointer">Save order</button></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">



<div style="display: flex; align-items: stretch; border: 1.5px solid var(--ink); background: var(--ground); border-radius: 14px; overflow: hidden; transition: border-color .2s, background-color .2s">
<button type="button" aria-pressed="" style="flex: 1; min-width: 0; font: inherit; text-align: left; cursor: pointer; background: transparent; border: 0; padding: 10px 14px; display: flex; align-items: center; gap: 14px; color: var(--ink); min-height: 64px">

<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Dunes May Challenge</span><span style="display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">[Start date] – [End date] · [Venue] · [City, State]</span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--pink-tint); color: var(--pink-tint-ink); padding: 3px 8px; border-radius: 999px; white-space: nowrap">Champions, Club Division</span>
</button>

</div>


</div>
</section>

<form id="il-admin-editor" style="flex: 2 1 340px; min-width: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-size: 18px; font-weight: 700">Edit tournament</h2><span style="color: var(--muted); font-size: 13px">Dunes May Challenge</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-name" style="font-weight: 600; font-size: 14px">Tournament name<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-name" type="text" value="Dunes May Challenge" placeholder="Tournament name" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-start" style="font-weight: 600; font-size: 14px">Start date<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-start" type="text" value="" placeholder="MM / DD / YYYY" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-end" style="font-weight: 600; font-size: 14px">End date<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-end" type="text" value="" placeholder="MM / DD / YYYY" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-venue" style="font-weight: 600; font-size: 14px">Venue / organizer<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-venue" type="text" value="" placeholder="[Venue]" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-city" style="font-weight: 600; font-size: 14px">City, State<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-city" type="text" value="" placeholder="[City, State]" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-tournaments-1-t0-result" style="font-weight: 600; font-size: 14px">Result<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-tournaments-1-t0-result" type="text" value="Champions, Club Division" placeholder="e.g. 1st of 24 teams" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px">Blank means upcoming.</span>
</div>

</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 16px">

<button type="button" style="font: inherit; font-weight: 600; color: var(--danger-ink); background: transparent; border: 0; height: 44px; padding: 0; cursor: pointer">Delete…</button>


<span style="display: flex; gap: 10px; margin-left: auto"><button type="button" style="font: inherit; font-weight: 600; height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); cursor: pointer">Cancel</button><button type="button" style="font: inherit; font-weight: 600; height: 46px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--inv-bg); color: var(--inv-fg); cursor: pointer">Save changes</button></span>
</div>
</form>
</div>






<div aria-live="polite" style="position: sticky; bottom: 24px; align-self: flex-end; margin-top: auto; height: 0; display: flex; align-items: flex-end; pointer-events: none">
<div style="background: var(--inv-bg); color: var(--inv-fg); font-weight: 600; padding: 14px 20px; border-radius: 14px; box-shadow: 0 16px 36px -14px rgba(13,17,23,.6); display: flex; align-items: center; gap: 10px; white-space: nowrap; transform: translateY(90px); opacity: 0; transition: transform .4s cubic-bezier(.2,1.2,.3,1), opacity .25s"><span style="width: 22px; height: 22px; border-radius: 50%; background: #55aeeb; color: #0d1117; display: flex; align-items: center; justify-content: center; font-size: 13px">✓</span>Saved</div>
</div>

</main>
</div>


</div>
</div></div>
</div>
</div>
</body>
</html>
