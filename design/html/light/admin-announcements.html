<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Admin announcements (light) — design reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}


body{margin:0}
.il-root{--ground:#F3F5F7;--surface:#FFFFFF;--ink:#0D1117;--muted:#56606E;--body:#3A4350;--line:#DDE2E8;--line2:#B6BEC9;--chip:#E9ECF0;--inv-bg:#0D1117;--inv-fg:#FFFFFF;--blue-ink:#1A73C8;--blue-tint:#DCEEFB;--blue-tint-ink:#0F4F8A;--pink-tint:#FCE7F0;--pink-tint-ink:#A80F4B;--band-bg:#0D1117;--band-fg:#FFFFFF;--dot1:#E84388;--dot2:#55AEEB;--panel:#0D1117;--logo-bg:transparent;--danger-ink:#8A1222;--danger-line:#F3B6BD;--warn-bg:#FFF6DF;--warn-line:#F0C36D;color-scheme:light}
.il-root[data-theme="dark"]{--ground:#0B0F15;--surface:#151B24;--ink:#F2F5F8;--muted:#9AA6B5;--body:#C3CBD6;--line:#283140;--line2:#3B4657;--chip:#232C39;--inv-bg:#F2F5F8;--inv-fg:#0D1117;--blue-ink:#6DBBF0;--blue-tint:#15324B;--blue-tint-ink:#9BD2F8;--pink-tint:#47162C;--pink-tint-ink:#F9A8CB;--band-bg:#E84388;--band-fg:#0D1117;--dot1:#0D1117;--dot2:#FFFFFF;--panel:#151B24;--logo-bg:#FFFFFF;--danger-ink:#FF9AA5;--danger-line:#5A1F27;--warn-bg:#33290F;--warn-line:#7A5E16;color-scheme:dark}
.il-root,.il-root *{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
.il-root input,.il-root textarea,.il-root select{background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<!-- Static design reference exported from the design canvas. Styling is inline on purpose: read it as a spec, do not paste it into the app. Not interactive. -->
<div style="display: contents;">

<div style="min-height: 900px; background: #FFFFFF">
<div style="display: contents;"><div style="display: contents;">

<div class="il-root" data-theme="light" style="font-family: Archivo, system-ui, sans-serif; color: var(--ink); background: var(--surface); font-size: 15px; line-height: 1.45">






<div style="display: flex; flex-wrap: wrap; min-height: 900px">

<aside style="flex: 1 0 232px; max-width: 100%; box-sizing: border-box; background: var(--ground); border-right: 1px solid var(--line); padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<img src="../../../assets/logo.png" alt="Impact Legends Volleyball" style="height: 60px; width: auto; display: block; background: var(--logo-bg); border-radius: 14px; padding: 2px 8px; box-sizing: border-box; margin-left: -6px">
<div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">Admin</div>
</div>
<nav aria-label="Admin" style="display: flex; flex-wrap: wrap; gap: 4px">

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"></path></svg>
<span style="flex: 1">Dashboard</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75"></span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.9M15.5 3.2a3.5 3.5 0 0 1 0 6.6"></path></svg>
<span style="flex: 1">Teams</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">6</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
<span style="flex: 1">Sponsors</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">8</span>
</button>

<button type="button" aria-current="page" style="flex: 1 1 150px; font: inherit; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: var(--inv-bg); color: var(--inv-fg); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l6 4V6L6 10H3zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
<span style="flex: 1">Announcements</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">3</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
<span style="flex: 1">Community</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">1</span>
</button>

<button type="button" style="flex: 1 1 150px; font: inherit; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink); transition: background-color .2s, color .2s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
<span style="flex: 1">Settings</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75"></span>
</button>

</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" role="switch" style="font: inherit; font-weight: 600; height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px">Dark mode<span style="position: relative; flex: none; width: 44px; height: 26px; border-radius: 999px; background: #8A94A3; transition: background-color .3s"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transform: translateX(0); transition: transform .3s cubic-bezier(.2,.8,.2,1)"></span></span></button>
<a href="#" style="text-decoration: none; color: var(--ink); text-align: center; padding: 11px 10px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 600">View site ↗</a>
<button type="button" style="font: inherit; font-weight: 600; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer">Sign out</button>
</div>
</aside>

<main id="il-admin-main" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">
















<div><h1 style="margin: 0; font-stretch: 125%; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.1">Announcements</h1><div style="color: var(--muted); margin-top: 4px">Posts in “Latest updates”. Reorder with the arrows, then save the order. New posts start at the top.</div></div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 3 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center">
<span style="color: var(--muted)">3 posts</span>
<button type="button" style="font: inherit; font-weight: 600; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); border: 0; cursor: pointer">+ New post</button>
</div>
<div style="overflow: hidden; max-height: 0px; opacity: 0; transition: max-height .35s ease, opacity .25s ease">
<div style="background: var(--inv-bg); color: var(--inv-fg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E84388"></span>Order changed. Not saved yet.</span>
<span style="display: flex; gap: 8px"><button type="button" style="font: inherit; font-weight: 600; height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--inv-fg); background: transparent; color: var(--inv-fg); cursor: pointer">Reset</button><button type="button" style="font: inherit; font-weight: 600; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--inv-fg); color: var(--inv-bg); cursor: pointer">Save order</button></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">



<div style="display: flex; align-items: stretch; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden; transition: border-color .2s, background-color .2s">
<button type="button" style="flex: 1; min-width: 0; font: inherit; text-align: left; cursor: pointer; background: transparent; border: 0; padding: 10px 14px; display: flex; align-items: center; gap: 14px; color: var(--ink); min-height: 64px">
<span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #CFE7F9; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #3a4350"></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Brynn McDougle Commits to Wright State Lake Campus</span><span style="display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Aug 15, 2026</span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--pink-tint); color: var(--pink-tint-ink); padding: 3px 8px; border-radius: 999px; white-space: nowrap">Signing</span>
</button>

<span style="display: flex; align-items: center; gap: 2px; padding-right: 6px"><button type="button" aria-label="Move Brynn McDougle Commits to Wright State Lake Campus up" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↑</button><button type="button" aria-label="Move Brynn McDougle Commits to Wright State Lake Campus down" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↓</button></span>

</div>




<div style="display: flex; align-items: stretch; border: 1.5px solid var(--ink); background: var(--ground); border-radius: 14px; overflow: hidden; transition: border-color .2s, background-color .2s">
<button type="button" aria-pressed="" style="flex: 1; min-width: 0; font: inherit; text-align: left; cursor: pointer; background: transparent; border: 0; padding: 10px 14px; display: flex; align-items: center; gap: 14px; color: var(--ink); min-height: 64px">
<span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #CFE7F9; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #3a4350"></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">2027 Team Tryouts</span><span style="display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">May 3, 2026</span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--chip); color: var(--ink); padding: 3px 8px; border-radius: 999px; white-space: nowrap">Announcement</span>
</button>

<span style="display: flex; align-items: center; gap: 2px; padding-right: 6px"><button type="button" aria-label="Move 2027 Team Tryouts up" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↑</button><button type="button" aria-label="Move 2027 Team Tryouts down" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↓</button></span>

</div>




<div style="display: flex; align-items: stretch; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden; transition: border-color .2s, background-color .2s">
<button type="button" style="flex: 1; min-width: 0; font: inherit; text-align: left; cursor: pointer; background: transparent; border: 0; padding: 10px 14px; display: flex; align-items: center; gap: 14px; color: var(--ink); min-height: 64px">
<span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #CFE7F9; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #3a4350"></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">14 Blue Tournament Champions</span><span style="display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">May 3, 2026</span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--blue-tint); color: var(--blue-tint-ink); padding: 3px 8px; border-radius: 999px; white-space: nowrap">Tournament</span>
</button>

<span style="display: flex; align-items: center; gap: 2px; padding-right: 6px"><button type="button" aria-label="Move 14 Blue Tournament Champions up" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↑</button><button type="button" aria-label="Move 14 Blue Tournament Champions down" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink)">↓</button></span>

</div>


</div>
</section>

<form id="il-admin-editor" style="flex: 2 1 340px; min-width: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-size: 18px; font-weight: 700">Edit post</h2><span style="color: var(--muted); font-size: 13px">2027 Team Tryouts</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-title" style="font-weight: 600; font-size: 14px">Title<span style="font-weight: 400; color: var(--muted); margin-left: 6px">required</span></label>
<input id="f-announcements-a1-title" type="text" value="2027 Team Tryouts" placeholder="" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-body" style="font-weight: 600; font-size: 14px">Body<span style="font-weight: 400; color: var(--muted); margin-left: 6px">required</span></label>

<textarea id="f-announcements-a1-body" rows="4" placeholder="" style="font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; font-size: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; line-height: 1.5; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; resize: vertical;">We will be holding tryouts on Wednesday, July 1 and Thursday, July 2 at Saint Aloysius School (14623 Bluffton Rd. Yoder, IN 46798): 6:00-7:30pm ages 14 and under; 7:30-9:00pm ages 15 and older. If you cannot make these tryouts, you can still register and let us know via email (legendssportsacademyfw@gmail.com). We will have secondary tryouts later in July and a final tryout to fill any remaining holes in October.</textarea>





<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-tag" style="font-weight: 600; font-size: 14px">Tag<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>


<select id="f-announcements-a1-tag" value="Announcement" style="font: inherit; height: 44px; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0 10px; background: var(--surface)"><option value="Announcement" selected="">Announcement</option><option value="Signing">Signing</option><option value="Tournament">Tournament</option><option value="Award">Award</option></select>




<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-date" style="font-weight: 600; font-size: 14px">Display date<span style="font-weight: 400; color: var(--muted); margin-left: 6px"></span></label>
<input id="f-announcements-a1-date" type="text" value="May 3, 2026" placeholder="e.g. Apr 18, 2026" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px">A label, typed as you want it shown.</span>
</div>

<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-photo" style="font-weight: 600; font-size: 14px">Photo<span style="font-weight: 400; color: var(--muted); margin-left: 6px">optional</span></label>



<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border: 1.5px dashed var(--line2); border-radius: 12px; padding: 12px"><span style="width: 84px; height: 56px; flex: none; border-radius: 8px; background: #f9cfe1; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 10px; color: #3a4350; text-transform: uppercase; text-align: center">Current</span><span style="flex: 1 1 120px; min-width: 0; color: var(--muted); font-size: 13px">JPG or PNG</span><button type="button" style="font: inherit; font-weight: 600; height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); cursor: pointer">Replace</button><button type="button" aria-label="Clear image" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); font: inherit; cursor: pointer">✕</button></div>



<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-url" style="font-weight: 600; font-size: 14px">Link URL<span style="font-weight: 400; color: var(--muted); margin-left: 6px">optional</span></label>
<input id="f-announcements-a1-url" type="text" value="https://forms.gle/cqX5Adzxy4asUqLi9" placeholder="https://" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>

<div style="grid-column: span 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="f-announcements-a1-urlLabel" style="font-weight: 600; font-size: 14px">Link label<span style="font-weight: 400; color: var(--muted); margin-left: 6px">optional</span></label>
<input id="f-announcements-a1-urlLabel" type="text" value="2027 Tryout Registration" placeholder="Button text" style="font: inherit; height: 44px; box-sizing: border-box; width: 100%; border: 1px solid var(--line2); border-radius: 10px; padding: 0px 12px;">






<span style="color: var(--muted); font-size: 13px"></span>
</div>
